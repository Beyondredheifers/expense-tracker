<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Expenses</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #fb7185;
      --line: #334155;
      font-family: system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .muted { color: var(--muted); font-size: .92rem; }
    form, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      display: grid;
      gap: .6rem;
      margin: 1rem 0;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    input, select, button {
      width: 100%;
      padding: .7rem .75rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      font-size: 1rem;
    }
    button {
      background: var(--accent);
      color: #082f49;
      border: 0;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #334155; color: var(--text); }
    button.danger { background: var(--danger); color: #3f0d16; }
    .actions { display: flex; gap: .6rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: .75rem 0;
      border-bottom: 1px solid var(--line);
    }
    li button { width: auto; padding: .4rem .7rem; }
    @media (max-width: 560px) {
      .row, .actions { grid-template-columns: 1fr; display: grid; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Local Expenses</h1>
    <p class="muted">Runs in your browser. Data never leaves this device. No API.</p>

    <form id="form">
      <div class="row">
        <input id="amount" type="number" step="0.01" min="0" placeholder="Amount" required />
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Fun</option>
          <option>Other</option>
        </select>
      </div>
      <div class="row">
        <input id="note" placeholder="Note (optional)" />
        <input id="date" type="date" required />
      </div>
      <button type="submit">Add expense</button>
    </form>

    <section class="card">
      <strong>This month: <span id="total">0.00</span></strong>
      <div id="by-cat" class="muted"></div>
    </section>

    <ul id="list"></ul>

    <div class="actions">
      <button class="secondary" id="export" type="button">Export JSON</button>
      <button class="secondary" id="importBtn" type="button">Import JSON</button>
      <button class="danger" id="clear" type="button">Clear all</button>
    </div>
    <input id="import" type="file" accept="application/json" hidden />
  </main>

  <script>
    const KEY = "expenses-v1";
    const $ = (id) => document.getElementById(id);
    const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
    const save = (items) => localStorage.setItem(KEY, JSON.stringify(items));

    $("date").valueAsDate = new Date();

    function render() {
      const items = load().sort((a, b) => b.date.localeCompare(a.date));
      const month = new Date().toISOString().slice(0, 7);
      const monthItems = items.filter((i) => i.date.startsWith(month));
      const total = monthItems.reduce((s, i) => s + Number(i.amount), 0);
      $("total").textContent = total.toFixed(2);

      const cats = {};
      monthItems.forEach((i) => {
        cats[i.category] = (cats[i.category] || 0) + Number(i.amount);
      });
      $("by-cat").textContent = Object.entries(cats)
        .map(([k, v]) => k + ": " + v.toFixed(2))
        .join(" · ") || "No expenses this month";

      $("list").innerHTML = items.map((i) => `
        <li>
          <div>
            <div><strong>${Number(i.amount).toFixed(2)}</strong> · ${escapeHtml(i.category)}</div>
            <div class="muted">${escapeHtml(i.date)}${i.note ? " · " + escapeHtml(i.note) : ""}</div>
          </div>
          <button data-id="${i.id}" class="danger">Delete</button>
        </li>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const items = load();
      items.push({
        id: crypto.randomUUID(),
        amount: Number($("amount").value),
        category: $("category").value,
        note: $("note").value.trim(),
        date: $("date").value
      });
      save(items);
      $("amount").value = "";
      $("note").value = "";
      render();
    });

    $("list").addEventListener("click", (e) => {
      const id = e.target.dataset.id;
      if (!id) return;
      save(load().filter((i) => i.id !== id));
      render();
    });

    $("export").onclick = () => {
      const blob = new Blob([JSON.stringify(load(), null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "expenses.json";
      a.click();
    };

    $("importBtn").onclick = () => $("import").click();
    $("import").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error("Expected an array");
          save(data);
          render();
        } catch (err) {
          alert("Could not import that file.");
        }
      };
      reader.readAsText(file);
    };

    $("clear").onclick = () => {
      if (confirm("Delete all local expenses?")) {
        localStorage.removeItem(KEY);
        render();
      }
    };

    render();
  </script>
</body>
</html>
